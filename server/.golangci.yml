run:
  timeout: 5m
  modules-download-mode: readonly

linters-settings:
  gofmt:
    simplify: true
  govet:
    enable-all: true
    disable:
      - fieldalignment
  lll:
    line-length: 180
  dupl:
    threshold: 200
  revive:
    enableAllRules: true
    rules:
      - name: exported
        disabled: true

linters:
  disable-all: true
  enable:
    - gofmt
    - goimports
    - ineffassign
    - unparam
    - errcheck
    - govet
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - exportloopref
    - gosec
    - makezero
    - staticcheck
    - prealloc
    - asciicheck
    - dogsled
    - dupl
    - goconst
    - gocritic
    - godot
    - err113
    - goheader
    - revive
    - nakedret
    - gomodguard
    - goprintffuncname
    - gosimple
    - lll
    - misspell
    - nolintlint
    - stylecheck
    - typecheck
    - unconvert
    - unused
    - whitespace
    - gocyclo

issues:
  exclude-dirs:
    - services/store/sqlstore/migrations
  exclude-rules:
    # These rules are valuable in production code, but create noise in tests:
    # test fixtures intentionally use repeated literals, synthetic errors and
    # descriptive Spanish text.
    - path: _test\.go
      linters:
        - dogsled
        - dupl
        - errcheck
        - err113
        - goconst
        - godot
        - gosec
        - gosimple
        - lll
        - misspell
        - unparam
